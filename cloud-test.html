<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Officina - prova cloud</title><style>body{font:18px system-ui;background:#0f172a;color:#eee;max-width:800px;margin:auto;padding:20px}input,button{font:inherit;padding:12px;margin:6px 0;box-sizing:border-box}input{display:block;width:100%}article{border:1px solid #64748b;padding:16px;margin:12px 0}button{min-height:44px}#status{white-space:pre-wrap}</style><h1>Officina - prova cloud</h1><p>Ambiente di integrazione. Non importa dati locali. Nessuna sincronizzazione offline. Sessione mantenuta soltanto in memoria fino alla chiusura o uscita.</p><form id="login"><label>Chiave pubblicabile del progetto<input id="key" required autocomplete="off" placeholder="Solo chiave pubblicabile, mai service_role o secret"></label><label>Email account di prova<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Accedi</button></form><button id="refresh" hidden>Aggiorna attività</button><button id="logout" hidden>Esci</button><p id="status" role="status" aria-live="polite">Non connesso</p><div id="activities"></div><script>
'use strict';
const base='https://nfrjhatqquefzjwykdqf.supabase.co';
const $=id=>document.getElementById(id);let token=null,key='',generation=0;
function status(s){$('status').textContent=s;}
function clearSession(){generation++;token=null;key='';$('activities').replaceChildren();$('login').hidden=false;$('refresh').hidden=true;$('logout').hidden=true;$('password').value='';$('key').value='';}
async function request(path,method='GET',body){const headers={apikey:key,'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(base+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal,cache:'no-store'});if(!r.ok){if(r.status===401){clearSession();throw Error('Sessione non valida o scaduta: accedi nuovamente.');}throw Error('Richiesta rifiutata ('+r.status+'). Aggiorna i dati prima di riprovare.');}return await r.json();}finally{clearTimeout(timer);}}
async function load(){const g=generation;status('Lettura dal database…');const memberships=await request('/rest/v1/memberships?select=workshop_id,role,display_name');const rows=await request('/rest/v1/activities?select=id,phase,status,version,started_at,operator_id&status=in.(active,paused)&limit=100');if(g!==generation)return;$('activities').replaceChildren();status(memberships.length?'Dati letti online. Elenco aggiornato su richiesta, massimo 100 attività.':'Account autenticato ma non associato a un’officina.');for(const a of rows){const card=document.createElement('article'),text=document.createElement('p');text.textContent=a.operator_id+' — '+a.phase+' — '+a.status+' — inizio '+new Date(a.started_at).toLocaleString('it-IT');const b=document.createElement('button');b.textContent=a.status==='paused'?'Riprendi':'Pausa';b.onclick=async()=>{b.disabled=true;try{await request('/rest/v1/rpc/set_activity_paused','POST',{p_activity_id:a.id,p_paused:a.status!=='paused',p_expected_version:a.version,p_reason:''});if(g!==generation)return;await load();}catch(e){if(g===generation)status('Operazione non confermata: '+e.message+' Premi Aggiorna prima di riprovare.');}};card.append(text,b);$('activities').append(card);}}
$('login').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{key=$('key').value.trim();if(!key.startsWith('sb_publishable_'))throw Error('Usa una chiave sb_publishable_, non una chiave segreta o legacy.');const g=generation;const data=await request('/auth/v1/token?grant_type=password','POST',{email:$('email').value.trim(),password:$('password').value});if(g!==generation)return;token=data.access_token;$('password').value='';$('key').value='';$('login').hidden=true;$('refresh').hidden=false;$('logout').hidden=false;await load();}catch(e){status(e.message);}finally{button.disabled=false;}};
$('refresh').onclick=()=>load().catch(e=>status(e.message));$('logout').onclick=async()=>{try{if(token)await request('/auth/v1/logout','POST');clearSession();status('Disconnesso.');}catch(e){clearSession();status('Sessione locale rimossa. Revoca sul server non confermata: '+e.message);}};
</script></html>
