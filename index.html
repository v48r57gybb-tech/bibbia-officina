<!doctype html>\n<html lang='it'>\n<head>\n<meta charset='utf-8'>\n<meta name='viewport' content='width=device-width, initial-scale=1'>\n<title>Bibbia Officina</title>\n<link rel='icon' href='icon.svg'>\n<link rel='apple-touch-icon' href='icon.svg'>\n<meta name='apple-mobile-web-app-capable' content='yes'>\n<meta name='apple-mobile-web-app-title' content='Bibbia Officina'>\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;height:100vh}\n#sidebar{width:230px;background:#1e293b;padding:16px;overflow-y:auto}\n#sidebar h1{font-size:18px;margin-bottom:16px;color:#38bdf8}\n.nav-item{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px}\n.nav-item:hover,.nav-item.active{background:#334155}\n#main{flex:1;padding:24px;overflow-y:auto}\n.card{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:16px}\ntable{width:100%;border-collapse:collapse;margin-top:12px}\nth,td{padding:8px;border-bottom:1px solid #334155;text-align:left}\nth{color:#94a3b8;font-weight:600}\nbutton{background:#38bdf8;color:#0f172a;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;margin:4px 4px 4px 0}\nbutton.secondary{background:#334155;color:#e2e8f0}\ninput,select,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;margin-bottom:8px}\nlabel{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px}\n#search{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;margin-bottom:16px}\n.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:2000}\n.modal-content{background:#1e293b;padding:24px;border-radius:12px;width:420px;max-height:80vh;overflow-y:auto}\n.hidden{display:none}\n.stat{display:inline-block;background:#334155;border-radius:8px;padding:12px 16px;margin:4px}\n.result{background:#0f172a;border-radius:8px;padding:12px;margin-top:8px;font-family:monospace}\n#topbar{position:fixed;top:0;right:0;z-index:1500;display:flex;gap:8px;padding:10px}\n#topbar button{margin:0}\n#account-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2500;display:flex;align-items:center;justify-content:center}\n#account-box{background:#1e293b;padding:24px;border-radius:12px;width:360px;max-height:80vh;overflow-y:auto}\n.time-log-panel{position:relative;z-index:1600}\n@media(max-width:700px){body{flex-direction:column}#sidebar{width:100%;height:auto}#nav{display:flex;flex-wrap:wrap}.nav-item{padding:8px 10px}}\n</style>\n</head>\n<body>\n<div id='topbar'><button id='account-button' data-act='select-account'>Cambia account</button><button class='secondary' data-act='logout'>Esci</button></div>\n<div id='account-overlay' class='hidden'><div id='account-box'><h3>Seleziona account</h3><div id='account-list'></div><button class='secondary' data-act='close-account'>Chiudi</button></div></div>\n<div id='sidebar'><h1>⚙️ Bibbia Officina</h1><div id='nav'></div></div>\n<div id='main'>\n<input id='search' placeholder='🔍 Cerca in tutta la bibbia...'>\n<div id='content'></div>\n</div>\n<div id='modal' class='modal hidden'><div class='modal-content' id='modal-body'></div></div>\n<script>\nconst LS='bibbiaOfficinaDB';\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);\nfunction seed(){return{\nmacchine:[{id:uid(),nome:'Fresatrice CNC 1',tipo:'Fresatrice',marca:'Haas',modello:'VF-2',anno:2021,stato:'Operativa'}],\nutensili:[{id:uid(),codice:'FRA-001',tipo:'Fresa',diametro:10,materiale:'Carburo',vitaUtile:120}],\nmateriali:[{id:uid(),nome:'Acciaio C45',tipo:'Acciaio',durezza:'HB 200'}],\nlavorazioni:[],parametri:[],fornitori:[],clienti:[],ordini:[],manutenzioni:[],documenti:[],\nknowledge:[{id:uid(),titolo:'Velocità di taglio acciaio C45',categoria:'Fresatura',contenuto:'Per acciaio C45 con fresa in carburo, Vc consigliata 120-180 m/min.'},{id:uid(),titolo:'Maschiatura metrica',categoria:'Maschiatura',contenuto:'Per maschi metrici, il foro pre-maschiatura è circa D meno il passo P.'},{id:uid(),titolo:'Perforazione acciaio',categoria:'Trapano',contenuto:'Per acciaio con punta HSS, Vc consigliata 20-30 m/min.'}],\noperatori:[],promemoria:[],programmi:[],lezioni:[],procedure:[],quiz:[],progressi:[],tempi:[]};}\nlet DB=JSON.parse(localStorage.getItem(LS)||'null')||seed();\n['operatori','promemoria','programmi','lezioni','procedure','quiz','progressi','tempi'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});\nfunction save(){localStorage.setItem(LS,JSON.stringify(DB));}\nfunction esc(s){return String(s==null?'':s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/'/g,'&#39;');}\nconst SCHEMA={\nmacchine:{label:'Macchine',icon:'⚙️',fields:[{k:'nome',l:'Nome'},{k:'tipo',l:'Tipo'},{k:'marca',l:'Marca'},{k:'modello',l:'Modello'},{k:'anno',l:'Anno',t:'number'},{k:'stato',l:'Stato'}]},\nutensili:{label:'Utensili',icon:'🔧',fields:[{k:'codice',l:'Codice'},{k:'tipo',l:'Tipo'},{k:'diametro',l:'Diametro (mm)',t:'number'},{k:'materiale',l:'Materiale'},{k:'vitaUtile',l:'Vita utile (min)',t:'number'}]},\nmateriali:{label:'Materiali',icon:'🧱',fields:[{k:'nome',l:'Nome'},{k:'tipo',l:'Tipo'},{k:'durezza',l:'Durezza'}]},\nlavorazioni:{label:'Lavorazioni',icon:'🛠️',fields:[{k:'nome',l:'Nome'},{k:'macchina',l:'Macchina',r:'macchine'},{k:'utensile',l:'Utensile',r:'utensili'},{k:'materiale',l:'Materiale',r:'materiali'},{k:'tempo',l:'Tempo (min)',t:'number'}]},\nparametri:{label:'Parametri',icon:'📐',fields:[{k:'lavorazione',l:'Lavorazione',r:'lavorazioni'},{k:'vc',l:'Vc (m/min)',t:'number'},{k:'fz',l:'Fz (mm/dente)',t:'number'},{k:'ap',l:'Ap (mm)',t:'number'},{k:'ae',l:'Ae (mm)',t:'number'},{k:'nota',l:'Nota'}]},\nfornitori:{label:'Fornitori',icon:'🚚',fields:[{k:'nome',l:'Nome'},{k:'contatto',l:'Contatto'},{k:'email',l:'Email'},{k:'telefono',l:'Telefono'}]},\nclienti:{label:'Clienti',icon:'🏢',fields:[{k:'nome',l:'Nome'},{k:'contatto',l:'Contatto'},{k:'email',l:'Email'},{k:'telefono',l:'Telefono'}]},\nordini:{label:'Ordini',icon:'📦',fields:[{k:'codice',l:'Codice'},{k:'cliente',l:'Cliente',r:'clienti'},{k:'consegna',l:'Consegna'},{k:'stato',l:'Stato'},{k:'note',l:'Note'}]},\nmanutenzioni:{label:'Manutenzioni',icon:'🧰',fields:[{k:'macchina',l:'Macchina',r:'macchine'},{k:'data',l:'Data'},{k:'tipo',l:'Tipo'},{k:'descrizione',l:'Descrizione'},{k:'prossimo',l:'Prossimo intervento'}]},\ndocumenti:{label:'Documenti',icon:'📄',fields:[{k:'titolo',l:'Titolo'},{k:'tipo',l:'Tipo'},{k:'link',l:'Link'},{k:'note',l:'Note'}]},\nknowledge:{label:'Conoscenza',icon:'📚',fields:[{k:'titolo',l:'Titolo'},{k:'categoria',l:'Categoria'},{k:'contenuto',l:'Contenuto',t:'textarea'}]},\noperatori:{label:'Operatori',icon:'👤',fields:[{k:'nome',l:'Nome'},{k:'ruolo',l:'Ruolo'},{k:'pin',l:'PIN'}]},\nprogrammi:{label:'Programmi CNC',icon:'📄',fields:[{k:'codice',l:'Codice'},{k:'titolo',l:'Titolo'},{k:'macchina',l:'Macchina'},{k:'tipo',l:'Tipo'},{k:'stato',l:'Stato'},{k:'note',l:'Note',t:'textarea'},{k:'contenuto',l:'Contenuto',t:'textarea'}]},\npromemoria:{label:'Promemoria',icon:'🔔',fields:[{k:'titolo',l:'Titolo'},{k:'quando',l:'Scadenza'},{k:'ripetizione',l:'Ripetizione'},{k:'stato',l:'Stato'}]},\ntempi:{label:'Registro tempi',icon:'⏱️',fields:[{k:'operatore',l:'Operatore'},{k:'lavorazione',l:'Lavorazione'},{k:'inizio',l:'Inizio'},{k:'fine',l:'Fine'},{k:'minuti',l:'Minuti',t:'number'},{k:'note',l:'Note',t:'textarea'}]}};\nconst SECTIONS=[{k:'dashboard',l:'Dashboard',i:'📊'},{k:'amministrazione',l:'Amministrazione',i:'🛡️'},{k:'tempi',l:'Tempi e report',i:'⏱️'},{k:'lezioni',l:'Lezioni',i:'📚'},{k:'procedure',l:'Procedure',i:'🧭'},{k:'quiz',l:'Quiz',i:'✅'},{k:'programmi',l:'Programmi CNC',i:'📄'},{k:'promemoria',l:'Promemoria',i:'🔔'},{k:'calcolatori',l:'Calcolatori',i:'🧮'},{k:'settings',l:'Impostazioni',i:'⚙️'}];\nlet current='dashboard',query='';\nfunction nameOf(coll,id){const o=DB[coll].find(r=>r.id===id);return o?(o.nome||o.codice||o.titolo||''):'-';}\nfunction renderNav(){document.getElementById('nav').innerHTML=SECTIONS.map(s=>`<div class='nav-item ${s.k===current?'active':''}' data-k='${s.k}'>${s.i} ${s.l}</div>`).join('');}\nfunction entityView(key){const s=SCHEMA[key];const q=query.toLowerCase();\nconst rows=DB[key].filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));\nreturn `<div class='card'><h2>${s.icon} ${s.label}</h2><button data-act='add' data-k='${key}'>+ Aggiungi</button>\n<table><tr>${s.fields.map(f=>`<th>${f.l}</th>`).join('')}<th>Azioni</th></tr>\n${rows.map(r=>`<tr>${s.fields.map(f=>`<td>${esc(f.r?nameOf(f.r,r[f.k]):r[f.k]||'')}</td>`).join('')}\n<td><button data-act='edit' data-k='${key}' data-id='${r.id}'>✏️</button><button data-act='del' data-k='${key}' data-id='${r.id}'>🗑️</button></td></tr>`).join('')}\n</table></div>`;}\nfunction dashboard(){const counts=Object.keys(SCHEMA).map(k=>`<span class='stat'>${SCHEMA[k].icon} ${SCHEMA[k].label}: <b>${DB[k].length}</b></span>`).join('');\nreturn `<div class='card'><h2>📊 Dashboard</h2><div>${counts}</div></div>\n<div class='card'><h2>🤖 Assistente rapido</h2><input id='ask' placeholder='Chiedi qualcosa...'><button data-act='ask'>Chiedi</button><div class='result' id='answer'>Scrivi una domanda sulla lavorazione o cerca nella conoscenza.</div></div>`;}\nfunction adminView(){return `<div class='card'><h2>🛡️ Amministrazione</h2><p>Gestione di operatori, report, promemoria e controlli.</p><button data-act='open-section' data-k='operatori'>👤 Operatori</button><button data-act='open-section' data-k='tempi'>⏱️ Tempi e report</button><button data-act='open-section' data-k='promemoria'>🔔 Promemoria</button></div>`;}\nfunction timesView(){return `<div class='card time-log-panel'><h2>⏱️ Registro tempi</h2><p>Registra e consulta i tempi di lavoro.</p><button data-act='open-section' data-k='tempi'>Apri registro completo</button></div>`;}\nfunction lessonsView(){return `<div class='card'><h2>📚 Lezioni</h2>${DB.lezioni.map(r=>`<p><b>${esc(r.titolo)}</b> — ${esc(r.percorso)}</p>`).join('')||'<p>Nessuna lezione.</p>'}</div>`;}\nfunction proceduresView(){return `<div class='card'><h2>🧭 Procedure</h2>${DB.procedure.map(r=>`<p><b>${esc(r.titolo)}</b> — ${esc(r.percorso)}</p>`).join('')||'<p>Nessuna procedura.</p>'}</div>`;}\nfunction quizView(){return `<div class='card'><h2>✅ Quiz</h2>${DB.quiz.map(r=>`<p><b>${esc(r.titolo)}</b> — ${esc(r.percorso)}</p>`).join('')||'<p>Nessun quiz.</p>'}</div>`;}\nfunction remindersView(){return `<div class='card'><h2>🔔 Promemoria</h2><button id='enable-notifications'>Attiva notifiche</button><p>I promemoria sono gestiti dall’amministrazione.</p></div>`;}\nfunction calcolatori(){return `\n<div class='card'><h2>🧮 Calcolatrice fresatura</h2>\n<label>Vc (m/min)</label><input id='vc' type='number' value='150'>\n<label>Diametro D (mm)</label><input id='d' type='number' value='10'>\n<label>Ap (mm)</label><input id='ap' type='number' value='2'>\n<label>Ae (mm)</label><input id='ae' type='number' value='5'>\n<label>Fz (mm/dente)</label><input id='fz' type='number' value='0.05'>\n<label>N° denti z</label><input id='z' type='number' value='4'>\n<button data-act='calc-taglio'>Calcola</button><div class='result' id='res-taglio'>-</div></div>`;}\nfunction settingsView(){return `<div class='card'><h2>⚙️ Impostazioni</h2>\n<button data-act='export'>⬇️ Esporta JSON</button>\n<label>Importa JSON</label><input type='file' id='import' accept='.json'>\n<button class='secondary' data-act='reset'>♻️ Reset dati</button></div>`;}\nfunction openForm(key,id){const s=SCHEMA[key];const item=id?DB[key].find(r=>r.id===id):{};\ndocument.getElementById('modal-body').innerHTML=`<h3>${id?'Modifica':'Nuovo'} ${s.label}</h3>\n${s.fields.map(f=>fieldHtml(f,item)).join('')}\n<button data-act='save' data-k='${key}' data-id='${id||''}'>Salva</button><button class='secondary' data-act='close'>Annulla</button>`;\ndocument.getElementById('modal').classList.remove('hidden');}\nfunction fieldHtml(f,item){if(f.r){const opts=DB[f.r].map(o=>`<option value='${o.id}' ${item[f.k]===o.id?'selected':''}>${esc(o.nome||o.codice||o.titolo)}</option>`).join('');\nreturn `<label>${f.l}</label><select data-f='${f.k}'><option value=''>--</option>${opts}</select>`;}\nconst t=f.t==='number'?'number':'text';\nif(f.t==='textarea')return `<label>${f.l}</label><textarea data-f='${f.k}'>${esc(item[f.k]||'')}</textarea>`;\nreturn `<label>${f.l}</label><input data-f='${f.k}' type='${t}' value='${esc(item[f.k]||'')}'>`;}\nfunction saveEntity(key,id){const s=SCHEMA[key];let obj=id?DB[key].find(r=>r.id===id):{id:uid()};\ns.fields.forEach(f=>{const el=document.querySelector(`[data-f='${f.k}']`);if(el)obj[f.k]=f.t==='number'?(parseFloat(el.value)||0):el.value;});\nif(!id)DB[key].push(obj);save();closeModal();render();}\nfunction closeModal(){document.getElementById('modal').classList.add('hidden');}\nfunction calcTaglio(){const vc=+document.getElementById('vc').value,d=+document.getElementById('d').value,ap=+document.getElementById('ap').value,ae=+document.getElementById('ae').value,fz=+document.getElementById('fz').value,z=+document.getElementById('z').value;\nconst n=1000*vc/(Math.PI*d),vf=n*z*fz,q=ap*ae*vf/1000;\ndocument.getElementById('res-taglio').innerHTML=`n = ${n.toFixed(0)} giri/min<br>vf = ${vf.toFixed(0)} mm/min<br>Q = ${q.toFixed(1)} cm³/min`;}\nfunction ask(){const q=document.getElementById('ask').value.toLowerCase();let ans='Nessun risultato. Prova con: fresatura, maschiatura, velocità, acciaio.';\nconst hits=DB.knowledge.filter(k=>(k.titolo+' '+k.categoria+' '+k.contenuto).toLowerCase().includes(q));\nif(q&&hits.length)ans=hits.map(h=>`<b>${esc(h.titolo)}</b><br>${esc(h.contenuto)}`).join('<br><br>');\ndocument.getElementById('answer').innerHTML=ans;}\nfunction exportJSON(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bibbia-officina.json';a.click();}\nfunction render(){renderNav();const c=document.getElementById('content');\nif(current==='dashboard')c.innerHTML=dashboard();\nelse if(current==='amministrazione')c.innerHTML=adminView();\nelse if(current==='tempi')c.innerHTML=timesView();\nelse if(current==='lezioni')c.innerHTML=lessonsView();\nelse if(current==='procedure')c.innerHTML=proceduresView();\nelse if(current==='quiz')c.innerHTML=quizView();\nelse if(current==='promemoria')c.innerHTML=remindersView();\nelse if(current==='calcolatori')c.innerHTML=calcolatori();\nelse if(current==='settings')c.innerHTML=settingsView();\nelse c.innerHTML=entityView(current);}\ndocument.getElementById('nav').addEventListener('click',e=>{const t=e.target.closest('.nav-item');if(t){current=t.dataset.k;render();}});\ndocument.getElementById('search').addEventListener('input',e=>{query=e.target.value;render();});\ndocument.getElementById('content').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;\nconst act=b.dataset.act,k=b.dataset.k,id=b.dataset.id;\nif(act==='add')openForm(k);\nelse if(act==='edit')openForm(k,id);\nelse if(act==='del'){if(confirm('Eliminare?')){DB[k]=DB[k].filter(r=>r.id!==id);save();render();}}\nelse if(act==='save')saveEntity(k,id);\nelse if(act==='close')closeModal();\nelse if(act==='open-section'){current=k;render();}\nelse if(act==='select-account'){window.boSelectAccount&&window.boSelectAccount();}\nelse if(act==='close-account'){document.getElementById('account-overlay').classList.add('hidden');}\nelse if(act==='logout'){document.getElementById('account-overlay').classList.remove('hidden');}\nelse if(act==='calc-taglio')calcTaglio();\nelse if(act==='ask')ask();\nelse if(act==='export')exportJSON();\nelse if(act==='reset'){if(confirm('Reset?')){localStorage.removeItem(LS);DB=seed();save();render();}}});\ndocument.getElementById('content').addEventListener('change',e=>{if(e.target.id==='import'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);save();render();}catch(err){alert('File non valido');}};r.readAsText(f);}});\nsave();render();\n</script>\n<script src='v3-training-fix.js'></script>\n<script src='v3-layout-fix.js'></script>\n<script src='v3-omp60-programs.js'></script>\n<script src='v3-reminders.js'></script>\n<script src='v3-knowledge-base.js'></script>\n</body>\n</html>
