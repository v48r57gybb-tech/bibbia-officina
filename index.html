<!doctype html>\n<html lang='it'>\n<head>\n<meta charset='utf-8'>\n<meta name='viewport' content='width=device-width, initial-scale=1'>\n<title>Bibbia Officina</title>\n<link rel='icon' href='icon.svg'>\n<link rel='apple-touch-icon' href='icon.svg'>\n<meta name='apple-mobile-web-app-capable' content='yes'>\n<meta name='apple-mobile-web-app-title' content='Bibbia Officina'>\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;height:100vh}\n#sidebar{width:230px;background:#1e293b;padding:16px;overflow-y:auto}\n#sidebar h1{font-size:18px;margin-bottom:16px;color:#38bdf8}\n.nav-item{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px}\n.nav-item:hover,.nav-item.active{background:#334155}\n#main{flex:1;padding:24px;overflow-y:auto}\n.card{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:16px}\nbutton{background:#38bdf8;color:#0f172a;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;margin:4px}\nbutton.secondary{background:#334155;color:#e2e8f0}\ninput,select,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;margin-bottom:8px}\nlabel{display:block;font-size:12px;color:#94a3b8;margin-bottom:4px}\n.hidden{display:none}\n#topbar{position:fixed;top:0;right:0;z-index:1500;display:flex;gap:8px;padding:10px}\n#account-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:2500;display:flex;align-items:center;justify-content:center}\n#account-box{background:#1e293b;padding:24px;border-radius:12px;width:360px;max-height:80vh;overflow-y:auto}\n.time-log-panel{position:relative;z-index:1600}\n</style>\n</head>\n<body>\n<div id='topbar'><button id='account-button' data-act='select-account'>Cambia account</button><button class='secondary' data-act='logout'>Esci</button></div>\n<div id='account-overlay' class='hidden'><div id='account-box'><h3>Seleziona account</h3><div id='account-list'></div><button class='secondary' data-act='close-account'>Chiudi</button></div></div>\n<div id='sidebar'><h1>⚙️ Bibbia Officina</h1><div id='nav'></div></div>\n<div id='main'><div id='content'></div></div>\n<script src='v4-data.js'></script>\n<script src='v4-core.js'></script>\n</body>\n</html>
