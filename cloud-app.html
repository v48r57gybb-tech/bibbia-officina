<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Officina - accesso cloud</title><style>html,body{margin:0;height:100%;font:16px system-ui;background:#0f172a;color:#eee}#gate{max-width:420px;margin:8vh auto;padding:24px;background:#111827;border:1px solid #334155;border-radius:16px}input,select,button{font:inherit;padding:12px;margin:8px 0;width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#eee}button{background:#2563eb;border-color:#2563eb;color:#fff;min-height:48px}#topbar{position:fixed;top:0;left:0;right:0;height:52px;background:#111827;border-bottom:1px solid #334155;display:none;align-items:center;justify-content:space-between;padding:0 16px;box-sizing:border-box}#topbar.show{display:flex}#app{display:none;position:fixed;top:52px;left:0;right:0;bottom:0;border:0;width:100%;height:calc(100% - 52px);background:#fff}#app.show{display:block}#status{min-height:24px;color:#fca5a5}</style><div id="gate"><h1>Officina</h1><p>Accesso cloud di prova</p><form id="login"><label>Account<select id="account" required><option value="">Seleziona account</option><option value="admin">Amministratore</option><option value="operator">Operatore</option></select></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Accedi</button></form><p id="status" role="status"></p></div><div id="topbar"><strong>Officina — cloud</strong><button id="logout" style="width:auto;margin:0">Esci</button></div><iframe id="app" src="about:blank" title="Officina"></iframe><script>
'use strict';
const base='https://nfrjhatqquefzjwykdqf.supabase.co';
const key='sb_publishable_o8G3naOXIStQu1PBUcYD1A_qbNFTT72';
const accounts={admin:atob('Q25jLnByb2Nlc3Mub3B0aW1pemVyQG91dGxvb2suaXQ='),operator:atob('TWFydGluby5QdWNjaUBHbWFpbC5jb20=')};
const $=id=>document.getElementById(id);let token=null;
function status(s){$('status').textContent=s;}
function openApp(role){sessionStorage.setItem('cloudRole',role);$('gate').style.display='none';$('topbar').classList.add('show');$('app').classList.add('show');$('app').src='./index.html';}
function closeApp(){sessionStorage.removeItem('cloudRole');sessionStorage.removeItem('bibbiaSessione');$('app').classList.remove('show');$('app').src='about:blank';$('topbar').classList.remove('show');$('gate').style.display='block';$('password').value='';$('account').value='';token=null;}
$('login').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const role=$('account').value;const email=accounts[role];if(!email)throw Error('Seleziona un account.');const r=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email,password:$('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error_description||data.msg||'Accesso non riuscito.');token=data.access_token;openApp(role);}catch(e){status(e.message);}finally{b.disabled=false;}};
$('logout').onclick=async()=>{try{if(token)await fetch(base+'/auth/v1/logout',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'}});}catch(e){}closeApp();status('');};
</script>
